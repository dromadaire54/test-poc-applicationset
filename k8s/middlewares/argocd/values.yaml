argo-cd:
  configs:
    params:
      controller.log.level: warn
    repositories:
      chronos-api:
        url: https://github.com/ManakinCubber/chronos-api
      chronos-mockoon:
        url: https://github.com/ManakinCubber/chronos-mockoon
      data-analytics:
        url: https://github.com/ManakinCubber/data-analytics
      data-science:
        url: https://github.com/ManakinCubber/data-science
      analytics-appfollow:
        url: https://github.com/ManakinCubber/analytics-appfollow
      analytics-tableau:
        url: https://github.com/ManakinCubber/analytics-tableau
      metabase:
        type: helm
        url: https://pmint93.github.io/helm-charts
      tiime-ops:
        url: https://github.com/ManakinCubber/tiime-ops
      hub:
        url: https://github.com/ManakinCubber/tiime-hub-php
      tiime-hub:
        url: https://github.com/ManakinCubber/tiime-hub
      labbs:
        type: helm
        url: https://labbs.github.io/github-actions-exporter
    cm:
      accounts.data-science: login
      accounts.data-engineering: login
      accounts.data-analytics: login
  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 60s
      rules:
        enabled: true
        spec:
          - alert: ArgoAppMissing
            expr: absent(argocd_app_info)
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "[ArgoCD] No reported applications"
              description: >
                ArgoCD has not reported any applications data for the past 15 minutes which
                means that it must be down or not functioning properly.
        selector:
          release: prometheus-operator
  dex:
    enabled: true
    envFrom:
      - secretRef:
          name: argocd-dex-sso-creds
  repoServer:
    env:
      - name: HELM_PLUGINS
        value: /custom-tools/helm-plugins/
      - name: HELM_SECRETS_HELM_PATH
        value: /usr/local/bin/helm
      - name: HELM_SECRETS_SOPS_PATH
        value: /custom-tools/sops
      - name: HELM_SECRETS_KUBECTL_PATH
        value: /custom-tools/kubectl
      - name: HELM_SECRETS_CURL_PATH
        value: /custom-tools/curl
      - name: HELM_SECRETS_VALUES_ALLOW_SYMLINKS
        value: "false"
      - name: HELM_SECRETS_VALUES_ALLOW_ABSOLUTE_PATH
        value: "false"
      - name: HELM_SECRETS_VALUES_ALLOW_PATH_TRAVERSAL
        value: "false"
      - name: HELM_SECRETS_IGNORE_MISSING_VALUES
        value: "true"
    initContainers:
      - args:
          - |
            mkdir -p /custom-tools/helm-plugins
            wget -qO- https://github.com/jkroepke/helm-secrets/releases/download/v${HELM_SECRETS_VERSION}/helm-secrets.tar.gz | tar -C /custom-tools/helm-plugins -xzf-;

            if [ "aarch64" = "$(uname -m)" ]; then
              wget -qO /custom-tools/sops https://github.com/mozilla/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.arm64
              wget -qO /custom-tools/kubectl https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/arm64/kubectl
              wget -qO /custom-tools/curl https://github.com/moparisthebest/static-curl/releases/latest/download/curl-aarch64
            elif [ "x86_64" = "$(uname -m)" ]; then
              wget -qO /custom-tools/sops https://github.com/mozilla/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux
              wget -qO /custom-tools/kubectl https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl
              wget -qO /custom-tools/curl https://github.com/moparisthebest/static-curl/releases/latest/download/curl-amd64
            fi

            chmod +x /custom-tools/*
        command:
          - sh
          - -ec
        env:
          - name: HELM_SECRETS_VERSION
            value: 4.6.5
          - name: SOPS_VERSION
            value: 3.10.2
          - name: KUBECTL_VERSION
            value: 1.31.0
        image: alpine:latest
        name: download-tools
        volumeMounts:
          - mountPath: /custom-tools
            name: custom-tools
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 60s
    serviceAccount:
      automountServiceAccountToken: true
      create: true
      name: argocd-repo-server
    volumeMounts:
      - mountPath: /custom-tools
        name: custom-tools
    volumes:
      - emptyDir: {}
        name: custom-tools
  server:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 60s
    serviceAccount:
      automountServiceAccountToken: true
      create: true
      name: argocd-server
  global:
    tolerations:
      - key: "arch"
        operator: "Equal"
        value: "arm64"
        effect: "NoSchedule"
    affinity:
      nodeAffinity:
        type: soft
        matchExpressions:
          - key: kubernetes.io/arch
            operator: In
            values:
              - arm64
