apiVersion: v1
kind: Secret
metadata:
  name: argocd-repo-creds-github
  namespace: argocd
  labels:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/part-of: argocd
    argocd.argoproj.io/secret-type: repo-creds
data:
  url: {{ .Values.github.url }}
  githubAppID: {{ .Values.github.githubAppID }}
  githubAppInstallationID: {{ .Values.github.githubAppInstallationID }}
  githubAppPrivateKey: {{ .Values.github.githubAppPrivateKey }}
