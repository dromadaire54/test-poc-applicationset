apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: 
    {{ include "dora.labels" $ | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{ include "dora.labels" $ | indent 6 }}
  template:
    metadata:
      labels: 
        {{ include "dora.labels" $ | indent 8 }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.dora.image.repository }}
          args:
            - "-config.file=/etc/dora/config.yaml"
          ports:
            - containerPort: 8090
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: github-token
          volumeMounts:
            - name: {{ .Release.Name }}-config
              mountPath: /etc/dora
          resources:
            limits:
              memory: {{ .Values.dora.resources.limits.memory}}
            requests:
              memory: {{ .Values.dora.resources.requests.memory}}
              cpu: {{ .Values.dora.resources.requests.cpu}}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64
      volumes:
        - name: {{ .Release.Name }}-config
          configMap:
            name: {{ .Release.Name }}-config
