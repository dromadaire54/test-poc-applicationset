        - m7i-flex.large
        - r7i.4xlarge
        - r7i.2xlarge
        - r7i.xlarge
        - r7i.large
      - name: topology.kubernetes.io/zone
        operator: In
        type:
        - eu-central-1a
        - eu-central-1b
        - eu-central-1c
      - name: karpenter.sh/capacity-type
        operator: In
        type:
        - spot
        - on-demand
      - name: kubernetes.io/arch
        operator: In
        type:
        - arm64
