karpenter:
  webhook:
    serviceNamespace: karpenter
  serviceMonitor:
    enabled: true
  settings:
    clusterName: tiime-prod
    interruptionQueue: Karpenter-tiime-prod
  eksControlPlane: true
  featureGates:
    spotToSpotConsolidation: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::284983278621:role/KarpenterControllerRole-tiime-prod
  controller:
    resources:
      requests:
        cpu: 1
        memory: 1Gi
      limits:
        cpu: 1
        memory: 1Gi
  tolerations:
    - key: tiime.tech/karpenter-managed
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: karpenter.sh/registered
            operator: DoesNotExist
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: "kubernetes.io/hostname"

nodePools:
  common:
    nodeClassRef: node-class-private
    disruption:
      consolidateAfter: 15m
    labels: {}
    taints: {}
    requirements:
      - name: node.kubernetes.io/instance-type
        operator: In
        type:
        - c7g.4xlarge
        - c7g.2xlarge
        - c7g.xlarge
        - c7g.large
        - m7g.4xlarge
        - m7g.2xlarge
        - m7g.xlarge
        - m7g.large
        - r7g.4xlarge
        - r7g.2xlarge
        - r7g.xlarge
