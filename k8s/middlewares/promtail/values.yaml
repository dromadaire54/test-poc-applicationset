promtail:
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  serviceMonitor:
    enabled: true
  service:
    annotations:
      tiime.tech/tmp: "true"
    labels:
      tiime.tech/tmp: "true"
  config:
    logLevel: warn
    snippets:
      scrapeConfigs: |
        - job_name: journal
          journal:
            path: /var/log/journal
            max_age: 73h
            labels:
              job: systemd-journal
          relabel_configs:
            - source_labels: ['__journal__systemd_unit']
              target_label: 'unit'
            - source_labels: ['__journal__hostname']
              target_label: 'hostname'
      pipelineStages:
        - cri: {}
        - docker: {}
        - json:
            expressions:
              extra: metadata
              output: log
              stream: stream
              timestamp: time
        - labeldrop:
            - filename
  tolerations:
    - effect: NoExecute
      operator: Exists
    - effect: NoSchedule
      operator: Exists

  extraVolumes:
    - name: journal
      hostPath:
        path: /var/log/journal

  extraVolumeMounts:
    - name: journal
      mountPath: /var/log/journal
      readOnly: true
