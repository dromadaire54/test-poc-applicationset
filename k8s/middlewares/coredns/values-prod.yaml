coredns:
  servers:
  - zones:
    - zone: .
    port: 53
    plugins:
    - name: errors
    - name: rewrite
      parameters: name subscription-manager.tiime.tech subscription-manager-backend.subscription-manager.svc.cluster.local
    - name: rewrite
      parameters: name licences.tiime.tech backend-api-internal.chronos-production.svc.cluster.local
    # - name: rewrite
      # parameters: name teleport.tiime.tech teleport-cluster.teleport-cluster.svc.cluster.local
    - name: health
      configBlock: |-
        lameduck 5s
    - name: ready
    - name: kubernetes
      parameters: cluster.local in-addr.arpa ip6.arpa
      configBlock: |-
        pods insecure
        fallthrough in-addr.arpa ip6.arpa
        ttl 30
    - name: prometheus
      parameters: 0.0.0.0:9153
    - name: forward
      parameters: . /etc/resolv.conf
    - name: cache
      parameters: 30
    - name: loop
    - name: reload
    - name: loadbalance


  hpa:
    minReplicas: 9
