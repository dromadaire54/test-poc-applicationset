coredns:
  servers:
  - zones:
    - zone: .
    port: 53
    plugins:
    - name: errors
    - name: rewrite
      parameters: name teleport.tiime.tech k8s-teleport-cluster-internal-87aabdea5cabb889.elb.eu-central-1.amazonaws.com
    - name: rewrite
      parameters: name subscription-manager.preprod.tiime.tech subscription-manager-backend.subscription-manager-development.svc.cluster.local
    - name: rewrite
      parameters: name subscription-manager-chronos-development.preprod.tiime.tech subscription-manager-backend.subscription-manager-chronos-development.svc.cluster.local
    - name: health
      configBlock: |-
        lameduck 5s
    - name: ready
    - name: kubernetes
      parameters: cluster.local in-addr.arpa ip6.arpa
      configBlock: |-
        pods insecure
        fallthrough in-addr.arpa ip6.arpa
        ttl 30
    - name: prometheus
      parameters: 0.0.0.0:9153
    - name: forward
      parameters: . /etc/resolv.conf
    - name: cache
      parameters: 30
    - name: loop
    - name: reload
    - name: loadbalance
