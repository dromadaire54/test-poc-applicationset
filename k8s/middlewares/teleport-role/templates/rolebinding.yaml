{{- range .Values.kubernetesRolesBinding }}
{{- $name := .name }}
{{- range .roles }}
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $name }}
  namespace: {{ .namespace }}
subjects:
  - kind: User
    name: {{ $name }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ .kind | default "ClusterRole" }}
  name: {{ .roleName | default "cluster-admin" }}
---
{{ end -}}
{{ end -}}

