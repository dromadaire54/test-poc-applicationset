aws-load-balancer-controller:
  clusterName: preprod
  region: eu-west-1
  repository: 602401143452.dkr.ecr.eu-west-1.amazonaws.com/amazon/aws-load-balancer-controller
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::990075099095:role/preprod_aws_load_balancer_controller_role

  objectSelector:
    matchExpressions:
        - key: elbv2.k8s.aws/pod-readiness-gate-inject
          operator: In
          values:
            - enabled
