              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64

  sourcemaps:
    enabled: true

  symbolicator:
    enabled: true
    api:
      resources:
        limits:
          memory: 250Mi
        requests:
          cpu: 100m
          memory: 250Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64

  zookeeper:
    autopurge:
      purgeInterval: 5 # the zookeeper data will be purged every 5h

    persistence:
      size: 60Gi

security-template-helm:
  networkPolicies:
    - name: sentry-network-policy
      enabled: true
      egress:
        rules:
          # -- Access all resources
          - {}
      ingress:
        rules:
          # -- Allow all pods in the same namespace
          - from:
              - podSelector: {}
          # -- Allow sentry web ans sentry relay pods from outside the cluster
          - from:
              - ipBlock:
                  cidr: 0.0.0.0/0
            ports:
              # -- sentry web port
              - port: 9000
                protocol: TCP
              # -- sentry relay port
              - port: 3000
                protocol: TCP
              # -- renew cert port
              - port: 8089
                protocol: TCP
          # -- Allow all pods from the metro namespace for metrics
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: metro
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: metrology
            ports:
              # -- sentry metrics port
              - port: 9102
                protocol: TCP
          # -- Allow all pod with in cert-manager instance inside the ingress namespace on port 8089
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: ingress
                podSelector:
                  matchLabels:
                    app.kubernetes.io/instance: cert-manager
            ports:
              # -- acme port (renewing certificate)
              - port: 8089
                protocol: TCP
