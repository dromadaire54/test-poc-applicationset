stunnel:
  clickhouse: c3l1zioi8z.eu-central-1.aws.clickhouse.cloud
  redis: master.sentry-cache.pkhxdu.euc1.cache.amazonaws.com

sentry:
  global:
    sidecars:
      - image: chainguard/stunnel:latest
        imagePullPolicy: Always
        name: stunnel
        resources:
          limits:
            memory: 20Mi
          requests:
            cpu: 10m
            memory: 10Mi
        command:
          - stunnel
          - /etc/conf/stunnel.conf
        stdin: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        tty: true
        volumeMounts:
          - mountPath: /etc/conf/
            name: stunnel-config
          - mountPath: /var/run/
            name: run
    volumes:
      - configMap:
          defaultMode: 420
          name: stunnel-config
          optional: false
        name: stunnel-config
      - name: run
        emptyDir: {}

  config:
    relay: |
      cache:
        envelope_buffer_size: 1000000
  externalClickhouse:
    host: "127.0.0.1"
    tcpPort: 9001
    httpPort: 8123
    username: default
    database: default
    singleNode: true

  clickhouse:
    enabled: false

  ## This value is only used when redis.enabled is set to false
  ##
  externalRedis:
    ## Hostname or ip address of external redis cluster
    ##
    host: "127.0.0.1"
    port: 6379

  externalPostgresql:
    host: sentry.cvbtref35tcn.eu-central-1.rds.amazonaws.com
    port: 5432
    username: master
    database: sentry
    # sslMode: require

  filestore:
    backend: s3
    s3:
      bucketName: tiime-prod-sentry
      region_name: eu-central-1
      default_acl: private

  github:
    appId: "325388"
    appName: SentryTiime

  slack:
    clientId: "3663372892.7227491173778"

  hooks:
    shareProcessNamespace: true
    activeDeadlineSeconds: 3600
    snubaMigrate:
      sidecars:
        - image: alpine:latest
          imagePullPolicy: Always
          name: sidecar-killer
          resources: {}
          command:
            - /bin/sh
            - -c
            - |
              while [ $(pgrep snuba) ];
              do
                echo 'waiting...'
                sleep 10
              done
              echo 'stunnel killed'
              pkill stunnel

    dbCheck:
      resources:
        limits:
          memory: 64Mi
        requests:
          cpu: 30m
          memory: 64Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      sidecars:
        - image: alpine:latest
          imagePullPolicy: Always
          name: sidecar-killer
          resources: {}
          command:
            - /bin/sh
            - -c
            - |
              while [ $(pgrep -f '/bin/sh -c echo \"Checking if clickhouse is up\"') ];
              do
                echo 'waiting...'
                sleep 10
              done
              echo 'stunnel killed'
              pkill stunnel

    dbInit:
      resources:
        limits:
          memory: 2048Mi
        requests:
          cpu: 300m
          memory: 2048Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      sidecars:
        - image: alpine:latest
          imagePullPolicy: Always
          name: sidecar-killer
          resources: {}
          command:
            - /bin/sh
            - -c
            - |
              while [ $(pgrep sentry) ];
              do
                echo 'waiting...'
                sleep 10
              done
              echo 'stunnel killed'
              pkill stunnel

    snubaInit:
      resources:
        limits:
          cpu: 2000m
          memory: 1Gi
        requests:
          cpu: 700m
          memory: 1Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      sidecars:
        - image: alpine:latest
          imagePullPolicy: Always
          name: sidecar-killer
          resources: {}
          command:
            - /bin/sh
            - -c
            - |
              while [ $(pgrep snuba) ];
              do
                echo 'waiting...'
                sleep 10
              done
              echo 'stunnel killed'
              pkill stunnel

