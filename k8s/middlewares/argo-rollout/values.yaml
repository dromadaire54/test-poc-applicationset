argo-rollouts:
  fullnameOverride: argo-rollout
  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  dashboard:
    # -- Deploy dashboard server
    enabled: true

  tolerations:
    - key: "arch"
      operator: "Equal"
      value: "arm64"
      effect: "NoSchedule"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: kubernetes.io/arch
            operator: In
            values:
            - arm64

  resources:
    limits:
      memory: 128Mi
      ephemeral-storage: 1Gi
    requests:
      cpu: 50m
      memory: 64Mi