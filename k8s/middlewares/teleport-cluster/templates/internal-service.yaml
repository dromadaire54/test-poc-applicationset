{{- if .Values.internalService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: internal-{{ .Release.Name }}
  namespace: {{.Release.Namespace}}
  labels: {{- include "teleport-cluster.proxy.labels" . | nindent 4}}
  annotations:
  {{- toYaml .Values.internalService.annotations | nindent 4 }}
spec:
  type: LoadBalancer
  ports:
    - name: tls
      port: 443
      targetPort: 3080
      protocol: TCP
    - name: sshproxy
      port: 3023
      targetPort: 3023
      protocol: TCP
    - name: k8s
      port: 3026
      targetPort: 3026
      protocol: TCP
    - name: sshtun
      port: 3024
      targetPort: 3024
      protocol: TCP
    - name: mysql
      port: 3036
      targetPort: 3036
      protocol: TCP
  selector: {{- include "teleport-cluster.proxy.selectorLabels" . | nindent 4}}
{{- end }}