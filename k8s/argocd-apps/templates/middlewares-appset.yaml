apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: middleware-tiime-finops
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
    - matrix:
        generators:
        - git:
            repoURL: https://github.com/dromadaire54/test-poc-applicationset.git
            revision: master
            directories:
            - path: ./k8s/middlewares/finops/*
        - git:
            repoURL: https://github.com/dromadaire54/test-poc-applicationset.git
            revision: master
            files:
            - path: ./k8s/middlewares/finops/**/config.json
  templatePatch: |
    {{ `
    {{- if .autosync }}
    spec:
     syncPolicy: :
        automated: {}
    {{- end }}
    ` }}
  template:
    metadata:
      name: 'middlewares-tiime-{{ `{{.path.basename}}` }}'
    spec:
      project: 'default'
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
      sources:
        - path: '{{ `{{.path.path}}` }}'
          repoURL: 'https://github.com/dromadaire54/test-poc-applicationset.git'
          helm:
            valueFiles:
              - "values-prod.yaml"
              - "secrets://values-prod.yaml"
            ignoreMissingValueFiles: true
      destination:
        namespace: 'argocd'
        server: 'https://kubernetes.default.svc'
