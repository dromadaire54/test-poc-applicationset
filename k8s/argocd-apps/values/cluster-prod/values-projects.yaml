argocd-template-helm:  
  argoApps: 
    argocd-project:
      appsNameOverride: argocd-projects-prod
      enabled: false
      spec:
        source:
          helm:
            valueFiles:
              - "values.yaml"
              - "values-default-settings.yaml"
              - "values/cluster-prod/values-projects.yaml"

  argoProjects:
    chronosProject:
      enabled: true

    dataProject:
      enabled: true

    dataScienceProject:
      enabled: true

    dataEngineeringProject:
      enabled: true

    dataAnalyticsProject:
      enabled: true
      
    hubProject:
      enabled: true

    opsProject:
      enabled: true
      spec:
        destinations:
          - namespace: "*"
            server: https://kubernetes.default.svc

    qaProject:
      enabled: true

    llmProject:
      enabled: true
