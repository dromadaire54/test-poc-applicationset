argocd-template-helm:
  argoApps:
    tiime-headmaster:
      enabled: false
      finalizer: false
      spec:
        project: ops
        source:
          repoURL: "https://github.com/ManakinCubber/tiime-ops.git"
          path: "./k8s/argocd-apps"
          targetRevision: "main"
        destination:
          namespace: argocd
        syncPolicy:
          automatedEnableDefaultConfig: false

    middlewares-tiime-aws:
      enabled: false
      finalizer: false
      spec:
        project: ops
        source:
          repoURL: "https://github.com/ManakinCubber/tiime-ops.git"
          path: "./k8s/argocd-apps"
          targetRevision: "main"
        destination:
          namespace: argocd
        syncPolicy:
          automatedEnableDefaultConfig: false

