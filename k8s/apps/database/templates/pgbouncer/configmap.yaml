{{- if and (hasKey .Values "pgbouncer") .Values.pgbouncer.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "database.pgbouncer.name" . }}-configmap
  labels: {{- include "database.pgbouncer.labels" $ | nindent 4}}
  annotations:
    "helm.sh/hook": "pre-install, pre-upgrade"
    "helm.sh/resource-policy": keep
data:
  pgbouncer.ini: |
    [databases]
    $POSTGRESQL_DATABASE=host=$POSTGRESQL_HOST port=$POSTGRESQL_PORT dbname=$POSTGRESQL_DATABASE

    [pgbouncer]
    listen_port=6432
    listen_addr=0.0.0.0
    unix_socket_dir=/tmp/
    unix_socket_mode=0777
    auth_file=/opt/bitnami/pgbouncer/conf/userlist.txt
    auth_type=md5
    pidfile=/opt/bitnami/pgbouncer/tmp/pgbouncer.pid
    logfile=/opt/bitnami/pgbouncer/logs/pgbouncer.log
    admin_users=$POSTGRESQL_USERNAME
    stats_users=$POSTGRESQL_USERNAME
    client_tls_sslmode=disable
    server_tls_sslmode=prefer
    max_client_conn=300
    default_pool_size=40
    ignore_startup_parameters=extra_float_digits
    stats_period=60
    server_tls_ciphers=fast
    server_tls_protocols=secure
    tcp_user_timeout = 12500
    tcp_keepalive=1
    tcp_keepidle=1
    tcp_keepintvl=11
    tcp_keepcnt=3
    server_fast_close=1
    server_round_robin=1
  userlist.txt: |
    "$POSTGRESQL_USERNAME" "$POSTGRESQL_PASSWORD"
{{ end }}